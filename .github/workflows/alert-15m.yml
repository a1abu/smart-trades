name: Trade alert check (15m)

on:
  workflow_dispatch:
    inputs:
      force_trigger:
        description: "Force full pipeline for ALL tickers (ignore confluence check)"
        type: boolean
        default: false
      force_tickers:
        description: "Watchlist: Apple (AAPL), Advanced Micro Devices (AMD), Alphabet Class C (GOOG). Comma-separated, other US tickers also work for a one-off check. Leave blank for none."
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.run_check.outputs.triggered }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: run_check
        run: |
          result=$(python alert_bot.py check)
          echo "triggered=$result" >> "$GITHUB_OUTPUT"
        env:
          RESOLUTION: "15"
          FORCE_TRIGGER: ${{ github.event.inputs.force_trigger == 'true' && '1' || '0' }}
          FORCE_TICKERS: ${{ github.event.inputs.force_tickers }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

  analyze:
    needs: check
    if: fromJson(needs.check.outputs.triggered)[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private memory repo
        uses: actions/checkout@v4
        with:
          repository: a1abu/smart-trades-memory
          token: ${{ secrets.MEMORY_REPO_TOKEN }}
          path: memory-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests sentence-transformers
      - run: python alert_bot.py analyze
        env:
          TRIGGERED: ${{ needs.check.outputs.triggered }}
          RESOLUTION: "15"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      - name: Commit updated RAG memory
        run: |
          cd memory-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory.json
          git diff --staged --quiet || git commit -m "Update RAG memory"
          git push
