name: Trade alert check (5m)

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_trigger:
        description: "Force full pipeline (ignore confluence check)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.run_check.outputs.triggered }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: run_check
        run: echo "triggered=$(python alert_bot.py check)" >> "$GITHUB_OUTPUT"
        env:
          RESOLUTION: "5"
          FORCE_TRIGGER: ${{ github.event.inputs.force_trigger == 'true' && '1' || '0' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

  analyze:
    needs: check
    if: fromJson(needs.check.outputs.triggered)[0] != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests sentence-transformers
      - run: python alert_bot.py analyze
        env:
          TRIGGERED: ${{ needs.check.outputs.triggered }}
          RESOLUTION: "5"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit updated RAG memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory.json
          git diff --staged --quiet || git commit -m "Update RAG memory"
          git push
