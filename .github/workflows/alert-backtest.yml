name: Trade alert backtest (diagnostic, manual only)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker to backtest (e.g. NVDA, or BTC/USD for crypto)"
        required: true
        default: "NVDA"
      is_crypto:
        description: "Is this a crypto symbol?"
        type: boolean
        default: false
      resolution:
        description: "Resolution to test"
        type: choice
        options: ["5", "15"]
        default: "5"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python alert_bot.py backtest
        env:
          RESOLUTION: ${{ github.event.inputs.resolution }}
          BACKTEST_SYMBOL: ${{ github.event.inputs.symbol }}
          BACKTEST_IS_CRYPTO: ${{ github.event.inputs.is_crypto == 'true' && '1' || '0' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
